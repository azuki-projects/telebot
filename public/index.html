<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Azuki Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b0d;color:#e8f1ef;font:15px system-ui,Arial}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 13px;background:#15a875;color:#06130e;font-weight:700}button.secondary{background:#202a2e;color:#e6eeee}button.danger{background:#a94444;color:white}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-size:22px;font-weight:800}.muted{color:#93a3a5}.card{background:#11191c;border:1px solid #253236;border-radius:15px;padding:16px;margin:12px 0}.login{max-width:400px;margin:12vh auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{font-size:24px;font-weight:800;margin-top:4px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button.active{background:#8de3bb}input{background:#080d0f;border:1px solid #344448;border-radius:10px;color:white;padding:11px;width:100%;outline:none;margin:6px 0}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:11px;border-bottom:1px solid #293539}th{color:#9bb0b0}.tablewrap{overflow:auto}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{max-width:250px}.pill{display:inline-block;border-radius:20px;padding:3px 9px;background:#233b32;color:#a6e5c2}.pill.bad{background:#482525;color:#ffc2c2}.hidden{display:none}.message{margin:8px 0;color:#9be4ba}.err{color:#ff9b9b}.section{display:none}.section.show{display:block}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.wrap{padding:12px}.card{padding:13px}}
</style></head><body><div class="wrap">
<div id="app"><header class="top"><div><div class="brand">AZUKI ADMIN</div><div class="muted">Telegram economy bot control panel</div></div></header>
<div class="grid"><div class="card">Users<div class="stat" id="statUsers">—</div></div><div class="card">Banned<div class="stat" id="statBanned">—</div></div><div class="card">Admins<div class="stat" id="statAdmins">—</div></div></div>
<div class="tabs"><button class="active" onclick="tab('users',this)">Users</button><button class="secondary" onclick="tab('admins',this)">Admins</button></div>
<section id="users" class="section show"><div class="card"><div class="row"><input id="search" placeholder="Search ID, username, name" oninput="loadUsers()"><button onclick="loadUsers()">Refresh</button></div><div class="tablewrap"><table><thead><tr><th>User</th><th>ID</th><th>Balance</th><th>Status</th><th>Actions</th></tr></thead><tbody id="userRows"></tbody></table></div><div id="usermsg" class="message"></div></div></section>
<section id="admins" class="section"><div class="card"><h3>Promote admin</h3><p class="muted">Enter Telegram numeric ID or username. Admins can use admin commands.</p><div class="row"><input id="newAdmin" placeholder="Telegram ID or @username"><button onclick="addAdmin()">Add admin</button></div><div id="adminmsg" class="message"></div><div class="tablewrap"><table><thead><tr><th>Identifier</th><th>Added</th><th>Action</th></tr></thead><tbody id="adminRows"></tbody></table></div></div></section>
</div></div>
<script>
async function api(url,options){options=options||{};const r=await fetch(url,Object.assign({},options,{headers:Object.assign({"Content-Type":"application/json"},options.headers||{})}));let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d.error||"Request failed");return d}
function showApp(){refresh();loadUsers();loadAdmins()}
async function refresh(){try{const s=await api("/api/stats");statUsers.textContent=s.users;statBanned.textContent=s.banned;statAdmins.textContent=s.admins}catch(e){logoutView()}}
async function loadUsers(){try{const rows=await api("/api/users?q="+encodeURIComponent(search.value));userRows.innerHTML=rows.map(u=>"<tr><td><b>"+esc(u.displayName||"Unknown")+"</b><br><span class='muted'>@"+esc(u.username||"—")+"</span></td><td>"+esc(u.tgId)+"</td><td>"+Number(u.money||0).toLocaleString()+"</td><td>"+(u.banned?"<span class='pill bad'>Banned</span>":"<span class='pill'>Active</span>")+"</td><td><div class='row'><button class='secondary' onclick='setBalance("+JSON.stringify(u.tgId)+","+Number(u.money||0)+")'>Balance</button>"+(u.banned?"<button onclick='unban("+JSON.stringify(u.tgId)+")'>Unban</button>":"<button class='danger' onclick='ban("+JSON.stringify(u.tgId)+")'>Ban</button>")+"</div></td></tr>").join("");usermsg.textContent=rows.length+" result(s)"}catch(e){usermsg.textContent=e.message}}
async function setBalance(id,current){const v=prompt("Set user's balance:",current);if(v===null)return;try{await api("/api/users/"+encodeURIComponent(id)+"/balance",{method:"POST",body:JSON.stringify({amount:Number(v)})});loadUsers();refresh()}catch(e){alert(e.message)}}
async function ban(id){const reason=prompt("Reason (optional):","Restricted by admin");if(reason===null)return;try{await api("/api/users/"+encodeURIComponent(id)+"/ban",{method:"POST",body:JSON.stringify({reason:reason})});loadUsers();refresh()}catch(e){alert(e.message)}}
async function unban(id){try{await api("/api/users/"+encodeURIComponent(id)+"/unban",{method:"POST"});loadUsers();refresh()}catch(e){alert(e.message)}}
async function loadAdmins(){try{const rows=await api("/api/admins");adminRows.innerHTML=rows.map(a=>"<tr><td>"+esc(a.identifier)+"</td><td>"+new Date(a.addedAt).toLocaleString()+"</td><td><button class='danger' onclick='removeAdmin("+JSON.stringify(a.identifier)+")'>Remove</button></td></tr>").join("")}catch(e){adminmsg.textContent=e.message}}
async function addAdmin(){const identifier=newAdmin.value.trim();if(!identifier)return;try{await api("/api/admins",{method:"POST",body:JSON.stringify({identifier:identifier})});newAdmin.value="";adminmsg.textContent="Admin added";loadAdmins();refresh()}catch(e){adminmsg.textContent=e.message}}
async function removeAdmin(id){if(!confirm("Remove admin "+id+"?"))return;try{await api("/api/admins/"+encodeURIComponent(id),{method:"DELETE"});loadAdmins();refresh()}catch(e){adminmsg.textContent=e.message}}
function tab(name,b){document.querySelectorAll(".section").forEach(x=>x.classList.remove("show"));document.getElementById(name).classList.add("show");document.querySelectorAll(".tabs button").forEach(x=>{x.classList.add("secondary");x.classList.remove("active")});b.classList.remove("secondary");b.classList.add("active")}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
showApp();
</script></body></html>
